<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Commerce — Test Mode</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #121319;
    --panel: #1a1c25;
    --panel-2: #21232e;
    --border: #2c2f3c;
    --text: #ece9e1;
    --text-dim: #8d8fa0;
    --amber: #d98e4a;
    --amber-dim: #6b4e30;
    --teal: #4fa98a;
    --red: #c4573f;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(217,142,74,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(79,169,138,0.05), transparent 40%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }

  .mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--amber), #b56a2c);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    color: #1a1005;
    flex-shrink: 0;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header p {
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--teal);
  }

  main {
    display: flex;
    gap: 0;
    max-width: 1180px;
    margin: 0 auto;
    height: calc(100vh - 68px);
  }

  /* ---------- CHAT COLUMN ---------- */
  #chat-col {
    flex: 1.8;
    display: flex;
    flex-direction: column;
    padding: 24px;
    min-width: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 6px;
  }

  .row { display: flex; gap: 10px; align-items: flex-end; animation: rise 0.28s ease; }
  .row.user { flex-direction: row-reverse; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--amber);
  }
  .row.user .avatar { visibility: hidden; width: 0; }

  .bubble {
    padding: 11px 14px;
    border-radius: var(--radius);
    max-width: 72%;
    line-height: 1.5;
    font-size: 14.5px;
  }
  .row.agent .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .row.user .bubble {
    background: #2a3b3a;
    border: 1px solid #375049;
    border-bottom-right-radius: 3px;
    color: #d7ede6;
  }

  #empty-hint {
    color: var(--text-dim);
    font-size: 13px;
    font-family: var(--font-mono);
    padding: 40px 10px;
    text-align: center;
  }

  /* ---------- CART / STAMP CARD ---------- */
  #cart {
    display: none;
    margin: 4px 0 14px;
    border: 1px dashed var(--amber-dim);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  #cart .cart-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #cart .cart-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
  }
  #cart .cart-price {
    font-family: var(--font-mono);
    color: var(--amber);
    font-size: 20px;
    margin-top: 2px;
  }
  #cart .cart-meta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  #cart .cart-actions { margin-top: 14px; display: flex; gap: 10px; }

  .stamp {
    position: absolute;
    top: 14px; right: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border: 2px solid var(--amber);
    color: var(--amber);
    border-radius: 4px;
    transform: rotate(6deg);
  }

  /* ---------- BUTTONS ---------- */
  button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .btn-primary { background: var(--amber); color: #1a1005; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

  /* ---------- INPUT ROW ---------- */
  #input-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  #userInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  #userInput:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  #userInput::placeholder { color: var(--text-dim); }

  /* ---------- AUDIT / RECEIPT COLUMN ---------- */
  #audit-col {
    flex: 1;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 24px 20px 30px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  #audit-col::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 14px;
    background:
      linear-gradient(135deg, var(--bg) 50%, transparent 50%) 0 0,
      linear-gradient(45deg, var(--bg) 50%, transparent 50%) 0 0;
    background-size: 14px 14px;
    background-repeat: repeat-x;
  }

  #audit-col h3 {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  #audit-col .audit-sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: #55586a;
    margin-bottom: 16px;
  }

  #auditTrail {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
    gap: 0;
  }

  .audit-item {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    animation: rise 0.25s ease;
  }
  .audit-item .step {
    color: var(--text);
    font-weight: 600;
  }
  .audit-item .step::before { content: "› "; color: var(--amber); }
  .audit-item .time { color: var(--text-dim); margin-top: 2px; }

  .audit-item.success .step { color: var(--teal); }
  .audit-item.fail .step { color: var(--red); }

  #auditEmpty {
    color: #55586a;
    font-family: var(--font-mono);
    font-size: 11.5px;
    text-align: center;
    padding-top: 30px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 820px) {
    main { flex-direction: column; height: auto; }
    #audit-col { border-left: none; border-top: 1px solid var(--border); max-height: 300px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">A</div>
  <div>
    <h1>Agent Commerce</h1>
    <p><span class="status-dot"></span>Razorpay test mode · every action logged</p>
  </div>
</header>

<main>
  <section id="chat-col">
    <div id="messages">
      <div id="empty-hint">Try: "gift for mom, budget 1500, skincare"</div>
    </div>

    <div id="cart"></div>

    <div id="input-row">
      <input id="userInput" placeholder="Ask the agent to find or buy something…" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </section>

  <aside id="audit-col">
    <h3>Audit trail</h3>
    <div class="audit-sub">timestamped · read-only</div>
    <div id="auditTrail">
      <div id="auditEmpty">No actions yet</div>
    </div>
  </aside>
</main>

<script>
const API = "http://localhost:8000";
let sessionId = null;

function addMessage(text, sender) {
  document.getElementById("empty-hint")?.remove();
  const row = document.createElement("div");
  row.className = "row " + sender;
  row.innerHTML = `
    <div class="avatar">${sender === "agent" ? "A" : ""}</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  const container = document.getElementById("messages");
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";

  const res = await fetch(`${API}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMessage(data.reply, "agent");

  if (data.status === "needs_confirmation") {
    showCart(data.cart_item);
  }
  refreshAudit();
}

function showCart(item) {
  const cart = document.getElementById("cart");
  cart.style.display = "block";
  cart.innerHTML = `
    <div class="stamp">pending</div>
    <div class="cart-label">Proposed order</div>
    <div class="cart-name">${escapeHtml(item.name)}</div>
    <div class="cart-price">₹${item.price}</div>
    <div class="cart-meta">match score ${item.match_score} · category: ${item.category}</div>
    <div class="cart-actions">
      <button class="btn-primary" onclick="confirmOrder(true)">Confirm &amp; pay</button>
      <button class="btn-secondary" onclick="confirmOrder(false)">Cancel</button>
    </div>
  `;
}

async function confirmOrder(confirm) {
  const res = await fetch(`${API}/api/confirm`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, confirm }),
  });
  const data = await res.json();
  document.getElementById("cart").style.display = "none";

  if (data.status === "cancelled") {
    addMessage(data.message, "agent");
    refreshAudit();
    return;
  }
  if (data.status === "order_created") {
    openRazorpayCheckout(data);
  }
}

function openRazorpayCheckout(order) {
  const options = {
    key: order.razorpay_key_id,
    amount: order.amount,
    currency: order.currency,
    name: "Agent Commerce",
    description: order.item.name,
    order_id: order.razorpay_order_id,
    handler: function (response) {
      verifyPayment({
        session_id: sessionId,
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
      });
    },
    modal: {
      ondismiss: function () {
        verifyPayment({
          session_id: sessionId,
          razorpay_order_id: order.razorpay_order_id,
          failed: true,
          error_description: "User closed the payment window",
        });
      },
    },
    theme: { color: "#d98e4a" },
  };
  const rzp = new Razorpay(options);
  rzp.on("payment.failed", function (response) {
    verifyPayment({
      session_id: sessionId,
      razorpay_order_id: order.razorpay_order_id,
      failed: true,
      error_description: response.error.description,
    });
  });
  rzp.open();
}

async function verifyPayment(payload) {
  const res = await fetch(`${API}/api/verify-payment`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  addMessage(data.message, "agent");
  refreshAudit();
}

async function refreshAudit() {
  if (!sessionId) return;
  const res = await fetch(`${API}/api/audit/${sessionId}`);
  const data = await res.json();
  const el = document.getElementById("auditTrail");

  if (!data.trail.length) {
    el.innerHTML = `<div id="auditEmpty">No actions yet</div>`;
    return;
  }

  el.innerHTML = data.trail
    .map((t) => {
      const cls = t.step.includes("verified") ? "success"
                : (t.step.includes("fail") || t.step.includes("block") || t.step.includes("declined")) ? "fail"
                : "";
      const time = new Date(t.timestamp * 1000).toLocaleTimeString();
      return `<div class="audit-item ${cls}">
        <div class="step">${t.step.replaceAll("_", " ")}</div>
        <div class="time">${time}</div>
      </div>`;
    })
    .reverse()
    .join("");
}
</script>
</body>
</html>
